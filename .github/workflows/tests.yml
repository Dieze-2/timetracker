name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TZ: Europe/Paris
      - name: Captures d'écran
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/output/
          retention-days: 7
