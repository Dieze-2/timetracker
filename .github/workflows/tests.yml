name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  navigateur:
    # Image figée : Playwright 1.56.1 ne sait pas installer Chromium sur
    # ubuntu-latest depuis son passage à 26.04 (« does not support chromium on
    # ubuntu26.04-x64 »). Passer à une image plus récente avec une montée de
    # version de Playwright, pas seule.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TZ: Europe/Paris
      - name: Captures d'écran
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: tests/output/
          retention-days: 7
